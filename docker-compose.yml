version: "3.9"

services:

  # ============================================================
  # KAFKA CLUSTER - 3 BROKERS (KRaft mode)
  # ============================================================

  kafka-1:
    image: apache/kafka:3.9.0
    container_name: kafka-1
    hostname: kafka-1
    restart: unless-stopped

    environment:
      # KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Cluster configuration
      KAFKA_CLUSTER_ID: "abcdefghijklmnopqrstuv"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2

      # Development-friendly settings
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka-1-data:/var/lib/kafka/data

    networks:
      - streaming

  kafka-2:
    image: apache/kafka:3.9.0
    container_name: kafka-2
    hostname: kafka-2
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CLUSTER_ID: "abcdefghijklmnopqrstuv"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka-2-data:/var/lib/kafka/data

    networks:
      - streaming

  kafka-3:
    image: apache/kafka:3.9.0
    container_name: kafka-3
    hostname: kafka-3
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CLUSTER_ID: "abcdefghijklmnopqrstuv"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka-3-data:/var/lib/kafka/data

    networks:
      - streaming


  # ============================================================
  # FLINK CLUSTER
  # ============================================================

  flink-jobmanager:
    build:
      context: .
      dockerfile: streaming_cluster/flink/Dockerfile
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    restart: unless-stopped

    command: jobmanager

    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        rest.address: flink-jobmanager
        rest.port: 8081
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2

    ports:
      - "8081:8081"

    networks:
      - streaming


  flink-taskmanager-1:
    build:
      context: .
      dockerfile: streaming_cluster/flink/Dockerfile
    container_name: flink-taskmanager-1
    hostname: flink-taskmanager-1
    restart: unless-stopped

    command: taskmanager

    depends_on:
      - flink-jobmanager

    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2

    networks:
      - streaming


  flink-taskmanager-2:
    build:
      context: .
      dockerfile: streaming_cluster/flink/Dockerfile
    container_name: flink-taskmanager-2
    hostname: flink-taskmanager-2
    restart: unless-stopped

    command: taskmanager

    depends_on:
      - flink-jobmanager

    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2

    networks:
      - streaming


  # ============================================================
  # EDGE NODE
  #
  # Contains:
  #   - Kafka CLI
  #   - Flink CLI
  # ============================================================

  edge:
    build:
      context: .
      dockerfile: streaming_cluster/edge/Dockerfile

    container_name: edge
    hostname: edge

    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - flink-jobmanager

    stdin_open: true
    tty: true

    networks:
      - streaming

    volumes:
      # mount Flink jobs
      - ./jobs:/opt/jobs


# ==============================================================
# NETWORK
# ==============================================================

networks:
  streaming:
    name: streaming-network
    driver: bridge


# ==============================================================
# PERSISTENT VOLUMES
# ==============================================================

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data: