[project]
name = "pyflink_example"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "apache-flink==1.20.3",
    "setuptools<81",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyflink_example"]

[tool.mypy]
ignore_missing_imports = true